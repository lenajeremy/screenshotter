<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenshotter Docs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236d5dfc'/%3E%3Crect x='11' y='6' width='10' height='20' rx='3' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root { --bg:#f7f6f3; --ink:#1d1d1f; --muted:#6e6a63; --line:#e4e1da; --code:#efede8; --accent:#5b4ee6; }
@media (prefers-color-scheme: dark) { :root { --bg:#161617; --ink:#f2f2f4; --muted:#a1a1a8; --line:#2e2e31; --code:#232326; --accent:#9b8fff; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
nav { position: sticky; top: 0; display: flex; gap: 16px; align-items: center; padding: 12px 24px; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); font-size: 13px; }
nav b { font-weight: 650; }
nav a { color: var(--muted); text-decoration: none; }
nav a:hover { color: var(--ink); }
article { max-width: 820px; margin: 0 auto; padding: 40px 24px 96px; }
h1 { font-size: 34px; letter-spacing: -0.02em; line-height: 1.15; margin: 0 0 8px; }
h2 { font-size: 22px; letter-spacing: -0.01em; margin: 44px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); }
h3 { font-size: 16px; margin: 26px 0 6px; }
p, li { color: color-mix(in oklab, var(--ink) 88%, var(--muted)); }
a { color: var(--accent); }
code { font: 13px ui-monospace, "SF Mono", Menlo, monospace; background: var(--code); padding: 1px 5px; border-radius: 5px; }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; }
pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0; display: block; overflow-x: auto; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
th { font-weight: 600; }
blockquote { margin: 16px 0; padding: 8px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
img { max-width: 100%; border-radius: 10px; }
</style>
</head>
<body>
<nav><b>Screenshotter</b><a href="/">Studio</a><a href="#install">Install</a><a href="#tools">Tools</a><a href="#examples">Examples</a></nav>

</body>
</html>
