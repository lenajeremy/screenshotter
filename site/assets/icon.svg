<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
<!-- Screenshotter: a frosted-glass phone floating over a lit lime card (the capture, framed). -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1f24"/><stop offset="1" stop-color="#08090b"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient>
  <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4ffb8"/><stop offset=".45" stop-color="#d2ff4d"/><stop offset="1" stop-color="#78cc12"/></linearGradient>
  <linearGradient id="milk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".3" stop-color="#fff" stop-opacity=".3"/><stop offset=".72" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/></linearGradient>
  <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".32"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  <filter id="frost" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="shade" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="-6" dy="26" stdDeviation="28" flood-color="#000" flood-opacity=".55"/></filter>
  <clipPath id="sq"><path d="M285 100H739A185 185 0 0 1 924 285V739A185 185 0 0 1 739 924H285A185 185 0 0 1 100 739V285A185 185 0 0 1 285 100Z"/></clipPath>
  <clipPath id="ph"><rect x="440" y="272" width="312" height="578" rx="88" transform="rotate(9 596 560)"/></clipPath>
</defs>
<path d="M285 100H739A185 185 0 0 1 924 285V739A185 185 0 0 1 739 924H285A185 185 0 0 1 100 739V285A185 185 0 0 1 285 100Z" fill="url(#bg)"/>
<g clip-path="url(#sq)">
  <rect x="228" y="244" width="340" height="540" rx="82" transform="rotate(-13 398 514)" fill="#c6ff2e" opacity=".5" filter="url(#glow)"/>
  <rect x="228" y="244" width="340" height="540" rx="82" transform="rotate(-13 398 514)" fill="url(#lime)"/>
  <!-- the glass: its shadow, then the card seen through it (blurred), a milky fill, a streak and a lit edge -->
  <rect x="440" y="272" width="312" height="578" rx="88" transform="rotate(9 596 560)" fill="#000" opacity=".001" filter="url(#shade)"/>
  <g clip-path="url(#ph)">
    <rect x="0" y="0" width="1024" height="1024" fill="#0f1114" opacity=".35"/>
    <g filter="url(#frost)"><rect x="228" y="244" width="340" height="540" rx="82" transform="rotate(-13 398 514)" fill="url(#lime)"/></g>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#milk)"/>
    <rect x="380" y="200" width="120" height="760" transform="rotate(28 440 580)" fill="url(#streak)"/>
  </g>
  <rect x="440" y="272" width="312" height="578" rx="88" transform="rotate(9 596 560)" fill="none" stroke="url(#edge)" stroke-width="6"/>
  <rect x="556" y="302" width="80" height="22" rx="11" transform="rotate(9 596 560)" fill="#0b0c0f" opacity=".7"/>
</g>
<path d="M285 100H739A185 185 0 0 1 924 285V739A185 185 0 0 1 739 924H285A185 185 0 0 1 100 739V285A185 185 0 0 1 285 100Z" fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
